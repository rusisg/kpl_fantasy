services:
  db:
    image: postgres:17-alpine
    container_name: kpl-fantasy-db-prod
    restart: always
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kpl_fantasy}
    volumes:
      - kpl_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kpl_fantasy}",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kpl-fantasy:latest
    container_name: kpl-fantasy-web-prod
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required in production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kplfantasy.kz}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required in production}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kpl_postgres_prod_data:
